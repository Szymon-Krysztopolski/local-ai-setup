services:
  local-ai:
    image: ollama/ollama:latest
    container_name: local-ai
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_KEEP_ALIVE: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  coding-agent:
    build:
      context: ./agent
    image: local/opencode-agent:latest
    container_name: coding-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    depends_on:
      - local-ai
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:14b}
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ./opencode:/root/.config/opencode
    profiles:
      - agent

volumes:
  ollama_data:
