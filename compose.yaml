
services:
  local-ai:
    image: ollama/ollama:latest
    container_name: local-ai
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_KEEP_ALIVE: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - local-ai
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://local-ai:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
    volumes:
      - open_webui_data:/app/backend/data

  coding-agent:
    build:
      context: ./agent
    image: local/opencode-agent:latest
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      HOME: /tmp
      OPENCODE_CONFIG: /opt/opencode-config/opencode.json
      OPENCODE_CONFIG_DIR: /opt/opencode-config
    volumes:
      - ./opencode:/opt/opencode-config:ro
    profiles:
      - agent

volumes:
  ollama_data:
  open_webui_data:
